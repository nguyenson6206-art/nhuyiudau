
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trái tim dành cho em ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(
        ellipse at center,
        #350817 0%,
        #17030d 55%,
        #080108 100%
    );
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Canvas tạo trái tim bằng các hạt sáng */
#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* Khu vực ảnh treo */
.photo-wall {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

/* Khung ảnh kiểu Polaroid */
.hanging-photo {
    position: absolute;
    width: clamp(90px, 11vw, 145px);
    padding: 7px 7px 25px;
    background: #f8e8df;
    box-shadow:
        0 0 18px #ff526533,
        0 8px 25px #0009;
    transform-origin: top center;
    animation: photoSwing 4s ease-in-out infinite alternate;
}

/* Ảnh bên trong khung */
.hanging-photo img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    background: #e6c9ce;
}

/* Dây treo ảnh */
.string {
    position: absolute;
    width: 2px;
    height: 100px;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    background: linear-gradient(
        to bottom,
        #8e5148,
        #e7a58c
    );
}

/* Kẹp ảnh */
.string::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 50%;
    width: 13px;
    height: 17px;
    transform: translateX(-50%);
    border-radius: 3px;
    background: #d69a64;
    box-shadow: 0 1px 4px #0006;
}

/* Bốn vị trí không đồng đều */
.photo1 {
    top: 15%;
    left: 5%;
    --angle: -9deg;
    transform: rotate(-9deg);
    animation-delay: -1s;
}

.photo2 {
    top: 10%;
    left: 25%;
    --angle: 7deg;
    transform: rotate(7deg);
    animation-delay: -2.2s;
}

.photo3 {
    top: 13%;
    right: 24%;
    --angle: -6deg;
    transform: rotate(-6deg);
    animation-delay: -0.7s;
}

.photo4 {
    top: 18%;
    right: 5%;
    --angle: 10deg;
    transform: rotate(10deg);
    animation-delay: -3s;
}

/* Ảnh đung đưa nhẹ */
@keyframes photoSwing {
    from {
        rotate: -2deg;
        translate: 0 -3px;
    }
    to {
        rotate: 2deg;
        translate: 0 5px;
    }
}

/* Nội dung nằm trên nền và ảnh */
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    pointer-events: none;
}

h1 {
    color: #ffb2cc;
    font-family: Georgia, serif;
    font-size: clamp(25px, 5vw, 39px);
    font-weight: normal;
    text-shadow: 0 0 20px #ff174f99;
    margin-bottom: 4px;
    animation: fadeIn 2s ease both;
}

.subtitle {
    color: #e9a2ba;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 10px;
    animation: fadeIn 2.5s ease both;
}

.heart-space {
    height: min(65vh, 560px);
    width: 100%;
    max-width: 650px;
    flex-shrink: 0;
}

.message {
    max-width: 440px;
    color: #ffe1eb;
    font-family: Georgia, serif;
    font-size: clamp(16px, 3.5vw, 21px);
    line-height: 1.8;
    text-shadow: 0 0 15px #ff3b7299;
    animation: fadeIn 3s ease both;
}

.signature {
    color: #ff91b7;
    font-size: 16px;
    margin-top: 8px;
    font-style: italic;
}

/* Nút quay lại */
.back {
    position: fixed;
    z-index: 5;
    top: 18px;
    left: 18px;
    border: 1px solid #ff8aaa66;
    color: #ffd5e2;
    background: #3b071dcc;
    padding: 10px 16px;
    border-radius: 25px;
    cursor: pointer;
}

.back:hover {
    background: #ff3e7855;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Điều chỉnh trên điện thoại */
@media (max-width: 600px) {
    .hanging-photo {
        width: 76px;
        padding: 4px 4px 14px;
    }

    .string {
        height: 58px;
    }

    .photo1 {
        top: 13%;
        left: 3%;
    }

    .photo2 {
        top: 9%;
        left: 25%;
    }

    .photo3 {
        top: 11%;
        right: 24%;
    }

    .photo4 {
        top: 15%;
        right: 3%;
    }

    .content {
        padding: 65px 12px 15px;
    }

    .heart-space {
        height: 48vh;
        max-height: 400px;
    }

    h1 {
        font-size: clamp(22px, 6vw, 30px);
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
    }

    .message {
        font-size: 15px;
    }

    .signature {
        font-size: 14px;
    }
}

@media (max-height: 650px) {
    .heart-space {
        height: 43vh;
    }

    h1 {
        font-size: 25px;
    }

    .message {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<!-- Nền trái tim hạt sáng -->
<canvas id="canvas"></canvas>

<!-- Ảnh kỷ niệm treo xung quanh -->
<div class="photo-wall">

    <div class="hanging-photo photo1">
        <span class="string"></span>
        <img src="anh1.jpg" alt="Kỷ niệm 1">
    </div>

    <div class="hanging-photo photo2">
        <span class="string"></span>
        <img src="anh2.jpg" alt="Kỷ niệm 2">
    </div>

    <div class="hanging-photo photo3">
        <span class="string"></span>
        <img src="anh3.jpg" alt="Kỷ niệm 3">
    </div>

    <div class="hanging-photo photo4">
        <span class="string"></span>
        <img src="anh4.jpg" alt="Kỷ niệm 4">
    </div>

</div>

<button class="back" onclick="history.back()">← Quay lại</button>

<!-- Nội dung chính -->
<main class="content">

    <h1>Trái tim này dành cho em ❤️</h1>

    <div class="subtitle">MY HEART BEATS FOR YOU</div>

    <div class="heart-space"></div>

    <div class="message">
        Chúc em 20/10 thật hạnh phúc, luôn xinh đẹp
        và mãi là cô gái đặc biệt trong lòng anh. ❤️

        <div class="signature">
        Anh thương em lắm💗
        </div>
    </div>

</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height, dpr;
let particles = [];
let backgroundStars = [];
let animationTime = 0;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
    createStars();
}

function createHeart() {
    particles = [];

    const count = Math.min(
        2400,
        Math.max(1000, Math.floor(width * 1.8))
    );

    for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;

        const x = 16 * Math.pow(Math.sin(t), 3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const fill = Math.sqrt(Math.random());

        particles.push({
            x: x * fill,
            y: -y * fill,
            size: 0.6 + Math.random() * 1.6,
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 1.5,
            drift: Math.random() * 0.35
        });
    }
}

function createStars() {
    backgroundStars = [];

    for (let i = 0; i < 100; i++) {
        backgroundStars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 1.6 + 0.3,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function draw() {
    animationTime += 0.025;

    ctx.clearRect(0, 0, width, height);

    // Sao lấp lánh phía sau
    for (const star of backgroundStars) {
        const glow = 0.25 + 0.65 *
            ((Math.sin(
                animationTime * 1.4 + star.phase
            ) + 1) / 2);

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 160, 190, ${glow})`;
        ctx.fill();
    }

    // Nhịp đập trái tim
    const beat =
        1
        + 0.055 * Math.pow(
            Math.max(0, Math.sin(animationTime * 2.2)),
            8
        )
        + 0.025 * Math.sin(animationTime * 2.2);

    // Điều chỉnh kích thước theo màn hình
    const scale = Math.min(
        width / 37,
        height / 44,
        15.5
    );

    const centerX = width / 2;
    const centerY = height * 0.49;

    // Quầng sáng đỏ
    const glowRadius = scale * 13 * beat;

    const glow = ctx.createRadialGradient(
        centerX, centerY, 1,
        centerX, centerY, glowRadius
    );

    glow.addColorStop(0, "rgba(255, 15, 75, 0.13)");
    glow.addColorStop(1, "rgba(255, 0, 70, 0)");

    ctx.fillStyle = glow;
    ctx.fillRect(
        centerX - glowRadius,
        centerY - glowRadius,
        glowRadius * 2,
        glowRadius * 2
    );

    // Vẽ các hạt tạo hình trái tim
    for (const p of particles) {
        const flutterX =
            Math.sin(animationTime * p.speed + p.phase)
            * p.drift;

        const flutterY =
            Math.cos(animationTime * p.speed + p.phase)
            * p.drift;

        const x = centerX + (p.x + flutterX) * scale * beat;
        const y = centerY + (p.y + flutterY) * scale * beat;

        const shimmer = 0.55 + 0.45 *
            ((Math.sin(
                animationTime * 2 + p.phase
            ) + 1) / 2);

        const radius = p.size * (0.85 + shimmer * 0.45);

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);

        ctx.fillStyle =
            `rgba(255, ${25 + Math.floor(shimmer * 45)}, ` +
            `${65 + Math.floor(shimmer * 65)}, ` +
            `${0.65 + shimmer * 0.35})`;

        ctx.shadowBlur = 7 * shimmer;
        ctx.shadowColor = "#ff174f";
        ctx.fill();
    }

    ctx.shadowBlur = 0;

    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

resize();
draw();
</script>

</body>
</html>
